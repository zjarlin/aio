name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: cargo fmt --all --check
      - run: cargo test -p az-studio -p az-aio-app -p az-aio-cli
      - run: npm test --prefix npm/aio
      - run: cargo run -q -p az-aio-cli -- plugin schema docs/plugin/schema
      - run: git diff --exit-code docs/plugin/schema
      - run: cargo clippy -p az-plugin-core -p az-studio -p az-aio-cli --all-targets -- -D warnings

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p az-studio -p az-aio-app -p az-aio-cli
      - run: cargo run -q -p az-aio-cli -- plugin schema docs/plugin/schema
      - run: git diff --exit-code docs/plugin/schema
      - run: cargo clippy -p az-plugin-core -p az-studio -p az-aio-cli --all-targets -- -D warnings

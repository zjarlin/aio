name: Marketplace

on:
  pull_request:
    paths:
      - "marketplace/**"
      - "cli/**"
      - ".github/workflows/marketplace.yml"
  push:
    branches: [main]
    paths:
      - "marketplace/**"
      - "cli/**"
      - ".github/workflows/marketplace.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p az-aio-cli
      - run: cargo run -q -p az-aio-cli -- marketplace build
      - run: git diff --exit-code marketplace/index.json

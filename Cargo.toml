[workspace]
resolver = "2"
members = [
    "client",
    "platform",
    "web",
    "plugins/asset-hub",
    "plugins/algorithm-center",
    "plugins/codegen",
    "plugins/config-center",
    "plugins/drive-center",
    "plugins/edge-gateway",
    "plugins/iot-center",
    "plugins/software-center",
    "plugins/ssh",
    "plugins/linux",
    "plugins/lowcode",
    "crates/algorithm/algorithm",
    "crates/algorithm/onnx",
    "crates/algorithm/ocr",
    "crates/core/automod",
    "crates/core/dict-macros",
    "crates/core/dict-spec",
    "crates/micro/micro-dict",
    "crates/network/ssh",
    "crates/runtime/admin-plugin-registry",
    "crates/runtime/engine",
    "crates/runtime/operation-agent",
    "crates/runtime/starter-audit",
    "crates/runtime/starter-dictionary",
    "crates/runtime/starter-identity",
    "crates/runtime/starter-menu",
    "crates/runtime/starter-organization",
    "crates/runtime/system-starters",
    "crates/text/str",
    "crates/ui/remote-ui",
]

[workspace.package]
version = "2026.5.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["zjarlin"]
homepage = "https://github.com/zjarlin/aio"
repository = "https://github.com/zjarlin/aio"

[workspace.dependencies]
ab_glyph = "0.2.32"
az-algorithm = { version = "=2026.5.10", path = "crates/algorithm/algorithm" }
az-onnx = { version = "=2026.5.10", path = "crates/algorithm/onnx" }
az-ocr = { version = "=2026.5.10", path = "crates/algorithm/ocr" }
az-str = { version = "=2026.5.10", path = "crates/text/str" }
anyhow = "1.0.99"
automod = { package = "az-automod", version = "=2026.6.15", path = "crates/core/automod" }
axum = { version = "0.8.6", features = ["http1", "json", "tokio", "multipart"] }
az-admin-plugin-registry = { version = "=2026.5.10", path = "crates/runtime/admin-plugin-registry" }
az-dict-macros = { version = "=2026.5.10", path = "crates/core/dict-macros" }
az-dict-spec = { version = "=2026.5.10", path = "crates/core/dict-spec" }
dioxus = { version = "0.7.9", default-features = false, features = ["macro", "html", "signals", "router"] }
dioxus-ssr = "0.7.9"
registry = { package = "registry", git = "https://github.com/rust-ui/dioxus-ui.git", rev = "91e8974e041baa9f993654ec448c3b05d973f9a9" }
tw-merge = { package = "tw_merge", version = "0.1.21", features = ["debug"] }
az-engine = { version = "=2026.5.10", path = "crates/runtime/engine" }
az-micro-dict = { version = "=2026.5.10", path = "crates/micro/micro-dict" }
az-operation-agent = { version = "=2026.5.10", path = "crates/runtime/operation-agent" }
az-starter-audit = { version = "=2026.5.10", path = "crates/runtime/starter-audit" }
az-starter-dictionary = { version = "=2026.5.10", path = "crates/runtime/starter-dictionary" }
az-starter-identity = { version = "=2026.5.10", path = "crates/runtime/starter-identity" }
az-starter-menu = { version = "=2026.5.10", path = "crates/runtime/starter-menu" }
az-starter-organization = { version = "=2026.5.10", path = "crates/runtime/starter-organization" }
az-system-starters = { version = "=2026.5.10", path = "crates/runtime/system-starters" }
az-ssh = { version = "=2026.5.10", path = "crates/network/ssh" }
base64 = "0.22.1"
convert_case = "0.8.0"
deunicode = "1.6.2"
derive_more = { version = "2.1.1", features = ["display"] }
evalexpr = "13.1.0"
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25.0"
inventory = "0.3.21"
ndarray = "0.17.1"
ort = "2.0.0-rc.12"
proc-macro2 = "1.0.103"
quote = "1.0.41"
regex = "1.12.2"
rudi = "0.8.3"
rqrr = { version = "0.10.1", default-features = false, features = ["img"] }
rhai = { version = "1", features = ["sync", "serde"] }
rusty-tesseract = "1.1.10"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
ssh2 = "0.9.5"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "migrate", "macros"] }
strum = { version = "0.27.2", features = ["derive"] }
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "sync"] }
tracing = "0.1.44"
toasty = { version = "0.7.0", features = ["postgresql", "serde"] }
trybuild = "1.0.112"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
handlebars = "6.4.1"
md5 = "0.8.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "cookies", "json", "multipart", "rustls-tls"] }
prettyplease = "0.2.37"
serde_json_path = "0.7.2"
syn = { version = "2.0.108", features = ["full", "parsing"] }
tower = { version = "0.5.2", features = ["timeout", "util"] }
tower-http = { version = "0.6.2", features = ["fs"] }
urlencoding = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
